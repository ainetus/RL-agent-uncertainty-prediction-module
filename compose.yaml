services:
  app:
    build:
      context: .
    image: grid2op-cp:local
    environment:
      CP_CONFIG: ${CP_CONFIG:-smoke}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:--1}
    volumes:
      - type: bind
        source: ${HOST_RESULTS_DIR:-./docker-output}
        target: /app/src/RESULTS
      - type: bind
        source: ${HOST_CACHE_DIR:-./docker-cache}
        target: /app/src/CACHE
      - type: volume
        source: grid2op-data
        target: /home/appuser/data_grid2op
    restart: "no"

volumes:
  grid2op-data:
